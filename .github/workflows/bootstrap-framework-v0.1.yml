name: Bootstrap AI Development Framework v0.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-framework-v0.1.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact Framework v0.1 source
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/erpsarang/self-improvement-mvp.git /tmp/framework
          git -C /tmp/framework checkout --quiet 9457926df28a88aa8fe340ad657c52e9f4f43f70
          test "$(git -C /tmp/framework rev-parse HEAD)" = "9457926df28a88aa8fe340ad657c52e9f4f43f70"

      - name: Build bootstrap branch from exact v0.1 runtime
        run: |
          set -euo pipefail
          git switch -c bootstrap/framework-v0.1

          mkdir -p .github src docs
          cp -R /tmp/framework/.github/ISSUE_TEMPLATE .github/
          cp -R /tmp/framework/.github/workflows/* .github/workflows/
          cp -R /tmp/framework/src/self-improvement src/
          cp -R /tmp/framework/policy ./policy
          cp -R /tmp/framework/test ./test
          cp /tmp/framework/package.json ./package.json
          cp /tmp/framework/package-lock.json ./package-lock.json
          cp /tmp/framework/tsconfig.json ./tsconfig.json
          cp /tmp/framework/.gitignore ./.gitignore
          cp /tmp/framework/docs/usage.md ./docs/framework-v0.1-usage.md

          # This one-time trusted bootstrap workflow must not survive the bootstrap PR.
          rm -f .github/workflows/bootstrap-framework-v0.1.yml

          # Keep application identity separate from the framework package identity.
          npm pkg set name=sales-order-exception-analyzer version=0.0.0 private=true
          npm install --package-lock-only --ignore-scripts

          cat > FRAMEWORK.md <<'EOF'
          # AI Development Framework

          This repository is bootstrapped with AI Development Framework MVP v0.1.

          - Source repository: `erpsarang/self-improvement-mvp`
          - Framework tag: `v0.1`
          - Framework source SHA: `9457926df28a88aa8fe340ad657c52e9f4f43f70`
          - Trust model: IMPLEMENT/FIX workers are untrusted; worker output is a candidate artifact.
          - Trusted Rail: SEAL → PUBLISH → VERIFY → Semantic REVIEW.
          - Verification: exact published SHA.
          - LOCAL_FIX: bounded loop.
          - Final merge: Human-only. Auto Merge is prohibited.

          Framework control-plane files under `.github/workflows`, `src/self-improvement`, and `policy`
          are infrastructure. Application feature work must not modify them unless a separate trusted
          control-plane change is explicitly authorized.
          EOF

          git config user.name "Trusted Framework Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap AI Development Framework v0.1"
          git push origin HEAD:refs/heads/bootstrap/framework-v0.1
