name: Trusted PLAN IMPLEMENT Handoff

on:
  workflow_run:
    workflows: ["Trusted PLAN_AUTHORIZE"]
    types: [completed]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  handoff:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.event == 'issue_comment') ||
      (github.event_name == 'issue_comment' &&
       github.event.action == 'created' &&
       github.event.issue.state == 'open' &&
       github.event.issue.pull_request == null &&
       github.event.comment.body == 'PLAN-재개')
    permissions:
      contents: read
      actions: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: PLAN_AUTHORIZE artifact exact 선택 또는 replay no-op
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              const issueNumber = Number(context.payload.issue?.number);
              if (!Number.isSafeInteger(issueNumber) || issueNumber < 1) {
                core.setFailed('PLAN rebind issue number is invalid');
                return;
              }

              const defaultBranch = context.payload.repository.default_branch;
              const { data: branch } = await github.rest.repos.getBranch({
                ...context.repo,
                branch: defaultBranch,
              });
              if (context.sha !== branch.commit.sha) {
                core.setFailed('PLAN rebind trusted code is not exact current default branch');
                return;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              const marker = /<!-- self-improvement:PLAN_AUTHORIZE approval-comment=(\d+) run-id=(\d+) run-attempt=(\d+) artifact=([^\s]+) -->/;
              const candidates = comments
                .filter((comment) => comment.user?.login === 'github-actions[bot]' && typeof comment.body === 'string')
                .map((comment) => {
                  const match = marker.exec(comment.body);
                  if (!match) return null;
                  const artifactName = match[4];
                  const expectedPrefix = `plan-authorize-issue-${issueNumber}-`;
                  if (!artifactName.startsWith(expectedPrefix)) return null;
                  return {
                    commentId: Number(comment.id),
                    runId: Number(match[2]),
                    runAttempt: Number(match[3]),
                    artifactName,
                  };
                })
                .filter(Boolean)
                .sort((a, b) => b.commentId - a.commentId);
              if (candidates.length < 1) {
                core.setFailed('no trusted PLAN_AUTHORIZE marker exists for PLAN rebind');
                return;
              }
              const selected = candidates[0];

              const { data: sourceRun } = await github.rest.actions.getWorkflowRun({
                ...context.repo,
                run_id: selected.runId,
              });
              if (
                sourceRun.name !== 'Trusted PLAN_AUTHORIZE' ||
                sourceRun.path !== '.github/workflows/plan-authorize.yml' ||
                sourceRun.event !== 'issue_comment' ||
                sourceRun.status !== 'completed' ||
                sourceRun.conclusion !== 'success' ||
                sourceRun.run_attempt !== selected.runAttempt ||
                sourceRun.head_branch !== defaultBranch
              ) {
                core.setFailed('PLAN rebind source PLAN_AUTHORIZE identity mismatch');
                return;
              }

              const { data: artifactData } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo,
                run_id: selected.runId,
                per_page: 100,
              });
              const exact = artifactData.artifacts.filter(
                (artifact) =>
                  !artifact.expired &&
                  artifact.name === selected.artifactName &&
                  /^sha256:[0-9a-f]{64}$/.test(artifact.digest || ''),
              );
              if (exact.length !== 1) {
                core.setFailed(`expected one exact PLAN_AUTHORIZE artifact for rebind; actual=${exact.length}`);
                return;
              }
              const artifact = exact[0];
              core.setOutput('should_run', 'true');
              core.setOutput('name', artifact.name);
              core.setOutput('id', String(artifact.id));
              core.setOutput('digest', artifact.digest);
              core.setOutput('run_id', String(selected.runId));
              core.setOutput('run_attempt', String(selected.runAttempt));
              core.setOutput('control_sha', branch.commit.sha);
              core.setOutput('rebind_target_sha', branch.commit.sha);
              return;
            }

            const run = context.payload.workflow_run;
            if (run.path !== '.github/workflows/plan-authorize.yml') {
              core.setFailed(`unexpected source workflow path: ${run.path}`);
              return;
            }
            core.setOutput('run_id', String(run.id));
            core.setOutput('run_attempt', String(run.run_attempt));
            core.setOutput('control_sha', run.head_sha);
            core.setOutput('rebind_target_sha', '');

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            const pattern = new RegExp(
              `^plan-authorize-issue-\\d+-plan-\\d+-attempt-\\d+-approval-\\d+-run-${run.id}-attempt-([1-9]\\d*)$`,
            );
            const matches = data.artifacts
              .filter((artifact) => !artifact.expired)
              .map((artifact) => {
                const match = pattern.exec(artifact.name);
                return match ? { artifact, attempt: Number(match[1]) } : null;
              })
              .filter(Boolean);
            const current = matches.filter(({ attempt }) => attempt === run.run_attempt);
            const prior = matches.filter(({ attempt }) => attempt < run.run_attempt);

            if (current.length === 1 && matches.length === 1) {
              const artifact = current[0].artifact;
              core.setOutput('should_run', 'true');
              core.setOutput('name', artifact.name);
              core.setOutput('id', String(artifact.id));
              core.setOutput('digest', artifact.digest ?? '');
              return;
            }

            if (current.length === 0 && prior.length === 1 && matches.length === 1) {
              core.info(`PLAN_AUTHORIZE attempt ${run.run_attempt} reused prior artifact; handoff is a no-op`);
              core.setOutput('should_run', 'false');
              return;
            }

            if (matches.length === 0) {
              const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100,
              });
              const authorizeJobs = jobsData.jobs.filter((job) => job.name === 'authorize');
              if (authorizeJobs.length === 1 && authorizeJobs[0].conclusion === 'skipped') {
                core.info('PLAN_AUTHORIZE job was skipped; handoff is a no-op');
                core.setOutput('should_run', 'false');
                return;
              }
            }

            core.setFailed(
              `expected one current PLAN_AUTHORIZE artifact, one prior replay artifact, or skipped authorize job; current=${current.length}, prior=${prior.length}, total=${matches.length}`,
            );

      - name: Trusted control-plane checkout
        if: steps.source.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.control_sha }}
          persist-credentials: false
          path: control

      - name: Node 설정
        if: steps.source.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control/package-lock.json

      - name: Trusted dependencies 설치
        if: steps.source.outputs.should_run == 'true'
        working-directory: control
        run: npm ci --ignore-scripts

      - name: PLAN_AUTHORIZE artifact 다운로드
        if: steps.source.outputs.should_run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.name }}
          path: ${{ runner.temp }}/plan-authorize
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: PLAN_AUTHORIZE artifact 구조 확인
        if: steps.source.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/plan-implement-handoff"
          mapfile -t files < <(find "${RUNNER_TEMP}/plan-authorize" -type f -name plan-authorize.json -print)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "plan-authorize.json must exist exactly once" >&2
            exit 1
          fi
          cp "${files[0]}" "${RUNNER_TEMP}/plan-implement-handoff/plan-authorize.json"

      - name: exact 승인 PLAN 검증 및 ImplementContract 생성
        if: steps.source.outputs.should_run == 'true'
        id: prepare
        working-directory: control
        run: node --import tsx src/self-improvement/plan-implement-handoff-handler.ts prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.run_attempt }}
          REBIND_TARGET_SHA: ${{ steps.source.outputs.rebind_target_sha }}
          SOURCE_ARTIFACT_NAME: ${{ steps.source.outputs.name }}
          SOURCE_ARTIFACT_ID: ${{ steps.source.outputs.id }}
          SOURCE_ARTIFACT_DIGEST: ${{ steps.source.outputs.digest }}
          PLAN_AUTHORIZE_JSON: ${{ runner.temp }}/plan-implement-handoff/plan-authorize.json
          HANDOFF_OUTPUT: ${{ runner.temp }}/plan-implement-handoff

      - name: exact approved base SHA checkout
        if: steps.source.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.prepare.outputs.base_sha }}
          persist-credentials: false
          path: target

      - name: exact-SHA Context Pack 생성
        if: steps.source.outputs.should_run == 'true'
        working-directory: control
        shell: bash
        env:
          TARGET_ROOT: ${{ github.workspace }}/target
          HANDOFF_OUTPUT: ${{ runner.temp }}/plan-implement-handoff
        run: |
          set -euo pipefail
          OBSERVED_BASE_SHA="$(git -C "$TARGET_ROOT" rev-parse HEAD)"
          export OBSERVED_BASE_SHA
          node --import tsx src/self-improvement/plan-implement-handoff-handler.ts context

      - name: Trusted ImplementContract / Context Pack artifact 저장
        if: steps.source.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/plan-implement-handoff/contract.json
            ${{ runner.temp }}/plan-implement-handoff/context.json
            ${{ runner.temp }}/plan-implement-handoff/prompt.md
            ${{ runner.temp }}/plan-implement-handoff/schema.json
            ${{ runner.temp }}/plan-implement-handoff/handoff.json
            ${{ runner.temp }}/plan-implement-handoff/source.json
          if-no-files-found: error

      # Canonical Execution Lineage Step 2A — shadow only.
      # 기존 Handoff artifact 저장이 끝난 뒤에 실행되며, 실패해도 Handoff 결과를 바꾸지 않는다.
      # lineage.json은 기존 artifact에 넣지 않고 sibling artifact로 발행한다
      # (downstream은 Handoff artifact의 exact file set을 검증하며, 아직 lineage를 읽지 않는다).
      - name: Canonical Execution Lineage shadow 생성
        if: steps.source.outputs.should_run == 'true'
        id: lineage
        continue-on-error: true
        working-directory: control
        shell: bash
        env:
          HANDOFF_OUTPUT: ${{ runner.temp }}/plan-implement-handoff
          LINEAGE_OUTPUT: ${{ runner.temp }}/plan-implement-handoff-lineage
          HANDOFF_RUN_ID: ${{ github.run_id }}
          HANDOFF_RUN_ATTEMPT: ${{ github.run_attempt }}
          HANDOFF_EVENT_NAME: ${{ github.event_name }}
          EXPECTED_CONTROL_SHA: ${{ steps.source.outputs.control_sha }}
        run: |
          set -euo pipefail
          OBSERVED_CONTROL_SHA="$(git rev-parse HEAD)"
          export OBSERVED_CONTROL_SHA
          node --import tsx src/self-improvement/plan-implement-handoff-handler.ts lineage

      - name: Canonical Execution Lineage shadow artifact 저장
        if: steps.source.outputs.should_run == 'true' && steps.lineage.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}-lineage
          path: ${{ runner.temp }}/plan-implement-handoff-lineage/lineage.json
          if-no-files-found: error
