name: Framework v0.2 exact bootstrap

on:
  push:
    branches:
      - chatgpt/framework-v0.2-upgrade
    paths:
      - .github/workflows/framework-v02-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Target exact branch checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/framework-v0.2-upgrade
          fetch-depth: 0

      - name: Source Framework exact SHA checkout
        uses: actions/checkout@v4
        with:
          repository: erpsarang/self-improvement-mvp
          ref: ee4f9d39688436c6da944a5e93118d9b1f16a4de
          path: .framework-source
          persist-credentials: false

      - name: Copy canonical v0.2 allowlist only
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=.framework-source
          workflows=(orchestrator.yml plan-authorize.yml plan-candidate-bridge.yml plan-implement-handoff.yml plan-implement-worker.yml plan.yml semantic-review.yml trusted-rail.yml)
          sources=(context-pack.ts deterministic-ci.ts fix.ts human-status.ts implement-contract.ts orchestrator.ts plan-authorization.ts plan-authorize-handler.ts plan-candidate-bridge-handler.ts plan-candidate-bridge.ts plan-human-output-context.ts plan-implement-handoff-handler.ts plan-implement-handoff.ts plan-implement-worker-handler.ts plan-implement-worker.ts planner-handler.ts planner.ts review-handler.ts review.ts seal-handler.ts seal.ts single-pass-worker.ts)
          tests=(context-pack.test.ts deterministic-ci.test.ts fix-dispatch-workflow.test.ts human-status-output.test.ts human-status.test.ts implement-contract.test.ts plan-authorization.test.ts plan-authorize-workflow.test.ts plan-candidate-bridge-workflow.test.ts plan-candidate-bridge.test.ts plan-implement-handoff-workflow.test.ts plan-implement-handoff.test.ts plan-implement-worker-workflow.test.ts plan-implement-worker.test.ts plan-provenance.test.ts plan-trusted-rail-bridge.test.ts planner-anchor-context.test.ts planner-human-output-context.test.ts planner.test.ts publish-workflow.test.ts seal-workflow.test.ts single-pass-worker.test.ts)
          for f in "${workflows[@]}"; do cp "$SOURCE/.github/workflows/$f" ".github/workflows/$f"; done
          for f in "${sources[@]}"; do cp "$SOURCE/src/self-improvement/$f" "src/self-improvement/$f"; done
          for f in "${tests[@]}"; do cp "$SOURCE/test/$f" "test/$f"; done
          cat > FRAMEWORK.md <<'EOF'
          # AI Development Framework

          This repository is bootstrapped with AI Development Framework MVP v0.2 canonical PLAN runtime.

          - Source repository: `erpsarang/self-improvement-mvp`
          - Framework line: `v0.2`
          - Framework source SHA: `ee4f9d39688436c6da944a5e93118d9b1f16a4de`
          - Canonical path: User Requirement → Read-only AI PLAN → Human `PLAN-승인` → PLAN_AUTHORIZE → ImplementContract + Context Pack → bounded untrusted Worker → deterministic CI → PLAN Bridge → SEAL → PUBLISH → VERIFY → Semantic REVIEW → bounded LOCAL_FIX if required → MERGE_READY → Human Merge.
          - Trust model: IMPLEMENT/FIX workers are untrusted; worker output is a candidate artifact.
          - Trusted Rail: exact-SHA/provenance validation is preserved.
          - Final merge: Human-only. Auto Merge is prohibited.
          EOF
          sed -i 's/^          //' FRAMEWORK.md
          rm -rf .framework-source
          rm -f .github/workflows/framework-v02-bootstrap.yml

      - name: Validate no product surface changed
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "$path" in
              FRAMEWORK.md|.github/workflows/*|src/self-improvement/*|test/*) ;;
              *) echo "unexpected bootstrap path: $path" >&2; exit 1 ;;
            esac
            case "$path" in
              src/order-analysis.ts|src/batch-order-analysis.ts|test/order-analysis.test.ts|test/batch-order-analysis.test.ts|README.md)
                echo "product surface changed: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only HEAD)

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Full regression
        run: npm test

      - name: Commit exact snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows src/self-improvement test FRAMEWORK.md
          if git diff --cached --quiet; then
            echo 'bootstrap produced no change' >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: upgrade framework canonical runtime to v0.2 (#9)'
          git push origin HEAD:chatgpt/framework-v0.2-upgrade
