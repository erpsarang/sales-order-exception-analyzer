name: App Self-Improvement Bootstrap

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  dispatch_learn_source:
    name: Human Merge → Trusted LEARN Source
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: write

    steps:
      - name: exact MERGE_READY / Trusted Rail / Business Feedback 선택
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const repository = context.payload.repository;
            const body = pr.body || '';
            const mergeReady = body.match(
              /<!-- ai-dev-framework:MERGE_READY issue=([1-9]\d*) reviewed-sha=([0-9a-f]{40}) -->/,
            );

            if (!mergeReady) {
              core.info('framework MERGE_READY PR이 아니므로 App Self-Improvement를 시작하지 않습니다');
              core.setOutput('should_run', 'false');
              return;
            }

            const issueNumber = Number(mergeReady[1]);
            const reviewedSha = mergeReady[2];
            if (
              pr.base.ref !== repository.default_branch ||
              pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              pr.head.ref !== `ai-publish/issue-${issueNumber}` ||
              pr.head.sha !== reviewedSha
            ) {
              core.setFailed('merged Human Merge PR exact identity mismatch');
              return;
            }

            const trusted = body.match(
              /<!-- ai-dev-framework:TRUSTED_RAIL run-id=([1-9]\d*) run-attempt=([1-9]\d*) orchestration-artifact=([^\s>]+) -->/,
            );
            if (!trusted) {
              core.setFailed('MERGE_READY PR에 exact Trusted Rail provenance marker가 없습니다');
              return;
            }

            const trustedRailRunId = Number(trusted[1]);
            const trustedRailRunAttempt = Number(trusted[2]);
            const orchestrationArtifactName = trusted[3];
            const expectedArtifact =
              `orchestration-provenance-issue-${issueNumber}-${trustedRailRunId}-attempt-${trustedRailRunAttempt}`;
            if (orchestrationArtifactName !== expectedArtifact) {
              core.setFailed('Trusted Rail orchestration artifact name mismatch');
              return;
            }

            const { data: trustedRun } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: trustedRailRunId,
            });
            if (
              trustedRun.run_attempt !== trustedRailRunAttempt ||
              trustedRun.status !== 'completed' ||
              trustedRun.conclusion !== 'success' ||
              trustedRun.path !== '.github/workflows/trusted-rail.yml' ||
              trustedRun.head_branch !== repository.default_branch
            ) {
              core.setFailed('Trusted Rail source run identity/status mismatch');
              return;
            }

            const { data: artifactData } = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo,
              run_id: trustedRailRunId,
              per_page: 100,
            });
            const orchestrationArtifacts = artifactData.artifacts.filter(
              (artifact) =>
                !artifact.expired &&
                artifact.name === orchestrationArtifactName &&
                /^sha256:[0-9a-f]{64}$/.test(artifact.digest || ''),
            );
            if (orchestrationArtifacts.length !== 1) {
              core.setFailed(
                `expected one exact orchestration artifact, found ${orchestrationArtifacts.length}`,
              );
              return;
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const businessFeedback = openIssues.filter(
              (issue) =>
                !issue.pull_request &&
                typeof issue.title === 'string' &&
                issue.title.startsWith('[사용자 피드백]'),
            );

            if (businessFeedback.length === 0) {
              core.info('열린 [사용자 피드백] Issue가 없어 이번 cycle은 no-op입니다');
              core.setOutput('should_run', 'false');
              return;
            }
            if (businessFeedback.length !== 1) {
              core.setFailed(
                `열린 [사용자 피드백] Issue가 정확히 1개여야 합니다: actual=${businessFeedback.length}`,
              );
              return;
            }

            core.setOutput('should_run', 'true');
            core.setOutput('issue_number', String(issueNumber));
            core.setOutput('human_merge_pr_number', String(pr.number));
            core.setOutput('trusted_rail_run_id', String(trustedRailRunId));
            core.setOutput('trusted_rail_run_attempt', String(trustedRailRunAttempt));
            core.setOutput('orchestration_artifact_name', orchestrationArtifactName);
            core.setOutput('business_evidence_issue_number', String(businessFeedback[0].number));

      - name: Trusted LEARN Source 자동 시작
        if: steps.source.outputs.should_run == 'true'
        uses: actions/github-script@v7
        env:
          REQUIREMENT_ISSUE_NUMBER: ${{ steps.source.outputs.issue_number }}
          HUMAN_MERGE_PR_NUMBER: ${{ steps.source.outputs.human_merge_pr_number }}
          TRUSTED_RAIL_RUN_ID: ${{ steps.source.outputs.trusted_rail_run_id }}
          TRUSTED_RAIL_RUN_ATTEMPT: ${{ steps.source.outputs.trusted_rail_run_attempt }}
          ORCHESTRATION_ARTIFACT_NAME: ${{ steps.source.outputs.orchestration_artifact_name }}
          BUSINESS_EVIDENCE_ISSUE_NUMBER: ${{ steps.source.outputs.business_evidence_issue_number }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'learn-source.yml',
              ref: context.payload.repository.default_branch,
              inputs: {
                requirement_issue_number: process.env.REQUIREMENT_ISSUE_NUMBER,
                human_merge_pr_number: process.env.HUMAN_MERGE_PR_NUMBER,
                trusted_rail_run_id: process.env.TRUSTED_RAIL_RUN_ID,
                trusted_rail_run_attempt: process.env.TRUSTED_RAIL_RUN_ATTEMPT,
                orchestration_artifact_name: process.env.ORCHESTRATION_ARTIFACT_NAME,
                business_evidence_issue_number: process.env.BUSINESS_EVIDENCE_ISSUE_NUMBER,
              },
            });
            core.info('Trusted LEARN Source를 자동 dispatch했습니다');

  resume_stalled_worker:
    name: Framework Fix Merge → stalled Worker 자동 Resume
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write

    steps:
      - name: Framework-only merge와 stalled cycle exact 선택 후 Resume
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const defaultBranch = context.payload.repository.default_branch;
            const frameworkRootTests = new Set([
              'test/orchestrator-workflow.test.ts',
              'test/plan-candidate-bridge-workflow.test.ts',
              'test/plan-candidate-bridge.test.ts',
              'test/plan-implement-worker-workflow.test.ts',
              'test/app-self-improvement-auto-loop.test.ts',
              'test/fix-dispatch-workflow.test.ts',
              'test/plan-candidate-bridge-recovery-finalize.test.ts',
              'test/plan-candidate-bridge-recovery-provenance.test.ts',
              'test/plan-trusted-rail-recovery-source.test.ts',
              'test/seal-workflow.test.ts',
            ]);
            const frameworkTest = (path) =>
              path.startsWith('test/self-improvement/') || frameworkRootTests.has(path);
            const frameworkDoc = /^docs\/(?:self-improvement\/|(?:architecture|trust-model|state-machine|phase-[1-6]-[^/]+|orchestrator-smoke|fix-loop-smoke-[^/]+)\.md$)/;
            const allowed = (path) => path.startsWith('.github/workflows/') ||
              path.startsWith('src/self-improvement/') || path === 'FRAMEWORK.md' ||
              frameworkDoc.test(path) || frameworkTest(path);

            const prFiles = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const rejectedPrFiles = prFiles.filter((file) =>
              !['added', 'modified'].includes(file.status) ||
              !allowed(file.filename) ||
              file.previous_filename,
            );
            if (prFiles.length === 0 || rejectedPrFiles.length > 0) {
              core.info('Framework-only merge가 아니므로 stalled Worker Resume은 no-op입니다');
              return;
            }

            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo,
              branch: defaultBranch,
            });
            const currentDefaultSha = branch.commit.sha;

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const stalledPattern =
              /<!-- ai-dev-framework:STALLED_WORKER issue=(\d+) handoff-run=(\d+) handoff-attempt=(\d+) artifact=([^\s>]+) base-sha=([0-9a-f]{40,64}) worker-run=(\d+) worker-attempt=(\d+) reason=INFRA_FAILURE -->/;
            const pending = [];

            for (const issue of openIssues.filter((item) => !item.pull_request)) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              for (const comment of comments) {
                const body = comment.body || '';
                const match = stalledPattern.exec(body);
                if (!match) continue;
                const stalled = {
                  issueNumber: Number(match[1]),
                  handoffRunId: Number(match[2]),
                  handoffRunAttempt: Number(match[3]),
                  artifact: match[4],
                  baseSha: match[5],
                  workerRunId: Number(match[6]),
                  workerRunAttempt: Number(match[7]),
                  commentId: comment.id,
                };
                if (stalled.issueNumber !== issue.number) {
                  core.setFailed('stalled marker issue identity mismatch');
                  return;
                }
                const resumeMarker =
                  `<!-- ai-dev-framework:RESUME_DISPATCH stalled-worker-run=${stalled.workerRunId} target-sha=${currentDefaultSha} -->`;
                if (comments.some((item) => (item.body || '').includes(resumeMarker))) continue;
                pending.push({ ...stalled, resumeMarker });
              }
            }

            if (pending.length === 0) {
              core.info('pending stalled Worker가 없어 Resume은 no-op입니다');
              return;
            }
            if (pending.length !== 1) {
              core.setFailed(`pending stalled Worker가 정확히 1개여야 합니다: actual=${pending.length}`);
              return;
            }
            const stalled = pending[0];

            const { data: handoffRun } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: stalled.handoffRunId,
            });
            if (
              handoffRun.name !== 'Trusted PLAN IMPLEMENT Handoff' ||
              handoffRun.path !== '.github/workflows/plan-implement-handoff.yml' ||
              handoffRun.event !== 'workflow_run' ||
              handoffRun.status !== 'completed' ||
              handoffRun.conclusion !== 'success' ||
              handoffRun.head_branch !== defaultBranch ||
              handoffRun.run_attempt !== stalled.handoffRunAttempt ||
              handoffRun.head_sha !== stalled.baseSha
            ) {
              core.setFailed('stalled source Handoff identity mismatch');
              return;
            }

            const { data: artifactData } = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo,
              run_id: stalled.handoffRunId,
              per_page: 100,
            });
            const exactArtifacts = artifactData.artifacts.filter(
              (artifact) => !artifact.expired && artifact.name === stalled.artifact,
            );
            if (exactArtifacts.length !== 1) {
              core.setFailed(`stalled Handoff artifact exact count mismatch: ${exactArtifacts.length}`);
              return;
            }

            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo,
              basehead: `${stalled.baseSha}...${currentDefaultSha}`,
              per_page: 100,
            });
            const files = comparison.files;
            if (!['ahead', 'identical'].includes(comparison.status) ||
                comparison.merge_base_commit.sha !== stalled.baseSha ||
                !Array.isArray(files) ||
                files.length > 50) {
              core.setFailed('stalled Resume compare is not a bounded ancestor diff');
              return;
            }
            const rejected = files.filter((file) =>
              !['added', 'modified'].includes(file.status) ||
              !allowed(file.filename) ||
              file.previous_filename,
            );
            if (rejected.length > 0) {
              core.setFailed(
                `stalled Resume requires fresh PLAN; application/ambiguous changes: ${rejected.map((f) => `${f.status}:${f.filename}`).join(',')}`,
              );
              return;
            }

            const { data: pendingComment } = await github.rest.issues.createComment({
              ...context.repo,
              issue_number: stalled.issueNumber,
              body: [
                stalled.resumeMarker,
                '## Framework Fix 반영 — Worker 자동 Resume',
                `stalled Worker: ${stalled.workerRunId}/${stalled.workerRunAttempt}`,
                `approved base: \`${stalled.baseSha}\``,
                `current trusted main: \`${currentDefaultSha}\``,
                'Framework-only diff를 확인했으며 기존 Human PLAN approval/Handoff를 재사용합니다.',
              ].join('\n\n'),
            });

            try {
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'plan-implement-worker.yml',
                ref: defaultBranch,
                inputs: {
                  source_handoff_run_id: String(stalled.handoffRunId),
                  source_handoff_run_attempt: String(stalled.handoffRunAttempt),
                  source_handoff_artifact_name: stalled.artifact,
                },
              });
              core.info(`stalled Issue #${stalled.issueNumber} Worker recovery를 자동 dispatch했습니다`);
            } catch (error) {
              try {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: pendingComment.id,
                });
              } catch {
                // Best effort cleanup; dispatch error is authoritative.
              }
              throw error;
            }

